
{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Event Management System{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% block header %}
    <header class="site-header" style="background-color: #343a40; color: white; padding: 10px 20px; display: flex; align-items: center;">
        <div class="logo-container" style="margin-right: 20px;">
            <a href="{% url 'home' %}">
                <img src="{% static 'images/ems_logo.png' %}" alt="" height="60px">
            </a>
        </div>   
        
        <div class="container" style="flex: 1;">
            <div class="header-content">
                <h1 style="margin: 0; font-size: 24px;">Event Management System</h1>
            </div>
        </div>
    </header>
    {% endblock %}
    
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    
    <script src="{% static 'js/main.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
